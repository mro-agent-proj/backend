# 로컬 개발용 인프라. AI 서버·MCP 서버가 준비되면 서비스를 추가합니다.
services:
  postgres:
    # RAG 임베딩 검색에 pgvector 확장이 필요합니다.
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: mro
      POSTGRES_USER: mro
      POSTGRES_PASSWORD: mro
      TZ: UTC
      # MCP 서버용 조회 전용 계정 (rag-mcp: mro_reader, business-mcp: mro_business_reader)
      MRO_RAG_READER_PASSWORD: ${MRO_RAG_READER_PASSWORD:-local-reader-only}
      MRO_BUSINESS_READER_PASSWORD: ${MRO_BUSINESS_READER_PASSWORD:-local-business-reader-only}
    ports:
      - "5432:5432"
    volumes:
      - mro-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mro
      RABBITMQ_DEFAULT_PASS: mro
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 관리 UI (mro / mro) — DLQ 메시지 확인·재전송
    volumes:
      - mro-rabbitmq:/var/lib/rabbitmq

volumes:
  mro-pgdata:
  mro-rabbitmq:
