# 로컬 개발용 인프라. AI 서버·MCP 서버가 준비되면 서비스를 추가합니다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mro
      POSTGRES_USER: mro
      POSTGRES_PASSWORD: mro
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - mro-pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mro
      RABBITMQ_DEFAULT_PASS: mro
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 관리 UI (mro / mro) — DLQ 메시지 확인·재전송
    volumes:
      - mro-rabbitmq:/var/lib/rabbitmq

volumes:
  mro-pgdata:
  mro-rabbitmq:
